<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pauta de Alimentación 30 Días</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
:root {
  --bg: #F6F8FB; --surface: #FFFFFF; --fg: #1B2430; --mut: #5B6675; --line: #E2E7EF;
  --d-bg: #FFF1CC; --d-fg: #7A4B00; --d-s: #F2A100;
  --k-bg: #DDF3DC; --k-fg: #1E5A2A; --k-s: #3BA55D;
  --a-bg: #DCEBFF; --a-fg: #1B4B91; --a-s: #2F7DE1;
  --o-bg: #ECE3FF; --o-fg: #4B2C91; --o-s: #8A5CF0;
  --c-bg: #FFE0DA; --c-fg: #8A2A1B; --c-s: #E5533D;
  --hf: 'Space Grotesk', system-ui, sans-serif; --bf: 'Inter', system-ui, sans-serif;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--bf); margin: 0; padding: 16px; }
.wrap { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 40px; padding-block: 20px; }
h1, h2, h3 { font-family: var(--hf); margin: 0; }
.hero { background: linear-gradient(135deg, var(--d-bg), var(--k-bg) 28%, var(--a-bg) 52%, var(--o-bg) 76%, var(--c-bg)); border-radius: 18px; padding: 28px 24px; }
.days { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 14px; margin-bottom: 24px; }
.day { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
.day header { display: flex; justify-content: space-between; align-items: center; padding: 2px 2px 6px; }
.day h3 { font-size: 20px; }
.chk { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--mut); cursor: pointer; }
.chk input { width: 18px; height: 18px; accent-color: var(--k-s); }
.day.done { opacity: .6; } .day.done h3 { text-decoration: line-through; }
.meal { display: grid; grid-template-columns: 90px minmax(0, 1fr); border-radius: 8px; overflow: hidden; margin-bottom: 4px; font-size: 13px; }
.ml { padding: 6px 8px; font-weight: 600; display: flex; align-items: center; }
.mb { padding: 6px 8px; }
.meal.d { background: var(--d-bg); color: var(--d-fg); } .meal.d .ml { background: var(--d-s); color: #2b1a00; }
.meal.a { background: var(--a-bg); color: var(--a-fg); } .meal.a .ml { background: var(--a-s); color: #fff; }
.meal.c { background: var(--c-bg); color: var(--c-fg); } .meal.c .ml { background: var(--c-s); color: #fff; }
#auth-screen { max-width: 400px; margin: 100px auto; background: var(--surface); padding: 30px; border-radius: 16px; border: 1px solid var(--line); text-align: center; }
#auth-screen input { width: 100%; padding: 10px; margin: 15px 0; border: 1px solid var(--line); border-radius: 8px; font-size: 16px; }
#auth-screen button { background: var(--a-s); color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; width: 100%; }
.hidden { display: none !important; }
</style>
</head>
<body>

<!-- Pantalla de Bloqueo por Clave -->
<div id="auth-screen">
  <h2>Acceso Privado</h2>
  <p style="color:var(--mut); font-size:14px; margin-top:8px;">Ingresa tu contraseña para ver la pauta de 30 días.</p>
  <input type="password" id="pass-input" placeholder="Contraseña">
  <button onclick="checkPassword()">Ingresar</button>
  <p id="error-msg" style="color:var(--c-s); font-size:13px; margin-top:10px; display:none;">Contraseña incorrecta</p>
</div>

<!-- Contenido Principal de los 30 Días -->
<div id="main-app" class="wrap hidden">
<header class="hero">
  <p style="font-size:12px; letter-spacing:.12em; text-transform:uppercase; font-weight:600; opacity:.8; margin-bottom:8px;">Plan personal · 30 días</p>
  <h1>Pauta de alimentación</h1>
  <p style="opacity:.8; margin:12px 0 0;">Cinco comidas al día con las porciones de tu guía.</p>
</header>

<section>
  <h2>Días 1 a 10</h2>
  <div class="days" id="box-1"></div>
  
  <h2>Días 11 a 20</h2>
  <div class="days" id="box-2"></div>
  
  <h2>Días 21 a 30</h2>
  <div class="days" id="box-3"></div>
</section>
</div>

<script>
const CLAVE_SECRETA = "RiaS2601"; // Puedes cambiar "1234" por tu contraseña deseada

function checkPassword() {
  const val = document.getElementById('pass-input').value;
  if(val === CLAVE_SECRETA) {
    document.getElementById('auth-screen').classList.add('hidden');
    document.getElementById('main-app').classList.remove('hidden');
    sessionStorage.setItem('auth_pauta', 'true');
  } else {
    document.getElementById('error-msg').style.display = 'block';
  }
}

if(sessionStorage.getItem('auth_pauta') === 'true') {
  document.getElementById('auth-screen').classList.add('hidden');
  document.getElementById('main-app').classList.remove('hidden');
}

const K = 'pauta30-progress';
let saved = JSON.parse(localStorage.getItem(K) || '{}');

for(let i=1; i<=30; i++) {
  const art = document.createElement('article');
  art.className = `day ${saved[i] ? 'done' : ''}`;
  art.innerHTML = `
    <header><h3>Día ${i}</h3><label class="chk"><input type="checkbox" ${saved[i]?'checked':''} data-d="${i}"><span>Cumplido</span></label></header>
    <div class="meal d"><div class="ml"><span>Desayuno</span></div><div class="mb">1 carbohidrato + 2 proteínas + 1 lácteo + 1 grasa</div></div>
    <div class="meal a"><div class="ml"><span>Almuerzo</span></div><div class="mb">1 carbohidrato + 3 proteínas + 1 grasa + verduras</div></div>
    <div class="meal c"><div class="ml"><span>Cena</span></div><div class="mb">1 carbohidrato + 2 proteínas + 1 grasa + verduras</div></div>
  `;
  const chk = art.querySelector('input');
  chk.addEventListener('change', (e) => {
    art.classList.toggle('done', e.target.checked);
    saved[i] = e.target.checked;
    localStorage.setItem(K, JSON.stringify(saved));
  });

  if(i <= 10) document.getElementById('box-1').appendChild(art);
  else if(i <= 20) document.getElementById('box-2').appendChild(art);
  else document.getElementById('box-3').appendChild(art);
}
</script>
</body>
</html>
